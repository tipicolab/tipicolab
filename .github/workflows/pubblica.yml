# Quando cambia il numero nel file VERSIONE, GitHub costruisce Tipico Lab.app su un Mac e la pubblica
# nella pagina Releases (con il tag v<numero>). Le app già installate la trovano e propongono l'aggiornamento.
name: Pubblica una versione

on:
  push:
    branches: [main]
    paths: [VERSIONE]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Legge il numero di versione
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSIONE)"
          echo "versione=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versione $V è già pubblicata: costruisco solo per controllo."
            echo "nuova=no" >> "$GITHUB_OUTPUT"
          else
            echo "nuova=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Python di python.org (universale, per Mac Intel e Apple)
        run: |
          curl -sSfL -o py.pkg https://www.python.org/ftp/python/3.13.7/python-3.13.7-macos11.pkg
          sudo installer -pkg py.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 --version

      - name: Costruisce l'app
        env:
          PY: /Library/Frameworks/Python.framework/Versions/3.13/bin/python3
          SOLO_BUILD: "1"
        run: bash build_app.sh

      - name: Controlli
        run: |
          APP="_build-app/dist/Tipico Lab.app"
          lipo -archs "$APP/Contents/MacOS/Tipico Lab"
          plutil -p "$APP/Contents/Info.plist" | grep ShortVersion
          unzip -l "_build-app/Fra-Tak-Studio.zip" | grep -q "Fra Tak Studio.app/Contents/MacOS/" || { echo "zip di compatibilità sbagliato"; exit 1; }
          unzip -l "_build-app/Tipico-Lab.zip" | grep -q "Tipico Lab.app/Contents/MacOS/" || { echo "zip sbagliato"; exit 1; }
          for f in index.html canvas.js canvas.css server.py openrouter.py aggiornamenti.py VERSIONE models.json; do
            test -f "$APP/Contents/Resources/$f" || { echo "manca $f"; exit 1; }
          done
          # nessuna chiave o dato personale dentro l'app
          ! find "$APP" -name config.json | grep -q . || { echo "config.json dentro l'app!"; exit 1; }
          ! grep -rIl "sk-or-v1-" "$APP/Contents/Resources" | grep -q . || { echo "una chiave dentro l'app!"; exit 1; }
          # il server parte e risponde (senza chiave, senza generare nulla)
          export FRATAK_DATI="$RUNNER_TEMP/dati" STUDIO_NO_BROWSER=1
          mkdir -p "$FRATAK_DATI"
          cd "$APP/Contents/Resources"
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 server.py & PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/stato >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ | grep -q "Tipico Lab"
          curl -sf http://127.0.0.1:8765/api/aggiornamento
          kill $PID

      - name: Pubblica nella pagina Releases
        if: steps.v.outputs.nuova == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.versione }}
        run: |
          NOTE="$(sed -n '/^## '"$V"'$/,/^## /p' NOVITA.md | sed '1d;/^## /d')"
          gh release create "v$V" "_build-app/Tipico-Lab.zip" "_build-app/Fra-Tak-Studio.zip" --target "$GITHUB_SHA" \
            --title "Tipico Lab $V" --notes "${NOTE:-Aggiornamento di Tipico Lab.}"
